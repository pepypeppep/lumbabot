services:
  lumba:
    build: .
    container_name: lumba-bot
    restart: unless-stopped
    stdin_open: true
    tty: true
    env_file:
      - .env
    environment:
      - PROJECTS_BASE_DIR=${PROJECTS_BASE_DIR:-/home/zsn/code}
      - OPENCODE_MODEL=${OPENCODE_MODEL:-deepseek/deepseek-v4-flash}
      - OPENCODE_FLAGS=${OPENCODE_FLAGS:---auto}
      - OPENCODE_PATH=${OPENCODE_PATH:-opencode}
      - BOT_NAME=${BOT_NAME:-lumba}
      - AUTO_PULL=${AUTO_PULL:-true}
      - AUTO_PUSH=${AUTO_PUSH:-true}
      - ALLOWED_NUMBERS=${ALLOWED_NUMBERS:-}
      - AUTH_SESSION_DIR=${AUTH_SESSION_DIR:-auth_info_baileys}
    volumes:
      # 1. WhatsApp session state (survives restarts so you only scan QR once)
      - ./auth_info_baileys:/app/auth_info_baileys

      # 2. Host project files: opencode runs directly on these codebases
      - /home/zsn/code:/home/zsn/code

      # 3. SSH credentials for automatic git pull and git push
      - ${HOME}/.ssh:/root/.ssh:ro

      # 4. OpenCode configuration & provider keys
      - ${HOME}/.config/opencode:/root/.config/opencode:ro

      # 5. Host Docker daemon socket: allows opencode to run docker compose exec inside sibling project containers
      - /var/run/docker.sock:/var/run/docker.sock
